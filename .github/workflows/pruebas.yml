name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev,demo]"
      - name: Pruebas, sin llaves de API
        run: pytest -q
      - name: Benchmark en un comando
        run: grifter bench --modelo mockllm > /dev/null
