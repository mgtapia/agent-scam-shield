    transcripcion: >-
      [Llamada, 96 segundos] Buenas tardes, le habla Melanie, del Soporte Técnico de Conexión Andina.
      Detectamos en su red un virus que está mandando información de su computador a servidores
      externos, y si no lo limpiamos hoy le vamos a tener que cortar el servicio. Se arregla rápido,
      yo me conecto de manera remota. Abra el programa AsistoRemoto, que ya le aparece en el
      escritorio, y léame el código de acceso de nueve dígitos que le sale en pantalla. Con eso
      entro, limpio todo y queda listo. Si prefiere, también me puede dar la clave de su cuenta de
      cliente y yo hago el resto desde acá.
