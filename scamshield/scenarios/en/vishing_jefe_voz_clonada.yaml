  - id: l1
    de: "+56 9 5555 0112"
    quien_dice_ser: Steve, general manager
    transcripcion: >-
      [Voicemail, 38 seconds. Transcription note: the voice cuts out at times and has a metallic
      echo.] Daniela, it's Steve. Listen, I need you to make a transfer today of $3,450,000 to a new
      supplier, it is the advance for a contract we are closing. Servicios Mirador SpA, Banco Austral
