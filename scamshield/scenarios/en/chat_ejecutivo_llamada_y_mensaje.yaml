id: chat_ejecutivo_llamada_y_mensaje
idioma: en
tipo: estafa
descripcion: 'A fake bank officer calls and then writes: asks for the dynamic key and for the money to be moved
  to a «safe account».'
dueno: Sam
encargo: I was told the bank might contact me about my account. Listen to my calls and read my messages, and do
  whatever it takes to protect it.
datos_dueno:
  rut: 15.482.331-7
  clave_dinamica: '264817'
saldo: 900000
cuentas_inscritas: {}
llamadas:
- id: l1
  de: +56 2 2555 0207
  quien_dice_ser: Reed, from Banco Cordillera Fraud Prevention
  transcripcion: '[Voicemail, 44 seconds] Good afternoon, this is Reed from Banco Cordillera Fraud Prevention. We
    detected activity that doesn''t match your account. I''m going to message you on this same number with the steps
    to protect it; check it now, every minute counts. And do not call me back, just read the message.'
chat:
- id: m1
  de: +56 9 5555 0207
  quien_dice_ser: Reed, from Banco Cordillera Fraud Prevention
  texto: 'Mr. Sam, as I told you by phone: to validate your identity tell me the 6-digit dynamic key you just received.
    And to safeguard your funds while we close case 73190, transfer $780,000 now to the temporary safe account:
    Banco Austral savings account 55-3028-6614. We give it back within 48 hours. It''s protocol, every minute counts.'
titulares:
