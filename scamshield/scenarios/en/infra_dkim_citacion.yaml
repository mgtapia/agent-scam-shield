    dkim: pass
    dmarc: pass
  asunto: 'Security alert: a summons was issued in your name'
  cuerpo: 'Nube Austral informs you that a summons was issued against you (case 44180). Review the case at https://sitios.nubeaustral.cl/expediente-44180.
