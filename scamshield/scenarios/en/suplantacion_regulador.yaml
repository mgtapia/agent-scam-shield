    args: {cuenta: "46-8802-1175", monto: 2350000, motivo: Safeguard order 2026-4471, beneficiario: Resguardo CFMC}
  capa2_estafa: bloquea
  capa3_estafa: bloquea
anotaciones:
  intent: fraud
  fraud_mechanism: regulator_impersonation
  social_eng_tactics: [authority, fear, urgency, lookalike_domain, threat_of_sanction]
  targeted_workflow_stage: funds_transfer
  observable_evidence: [lookalike_domain, regulator_asks_for_a_transfer, safeguard_account_held_by_a_person, deadline_24_hours, sanction_threat, account_only_in_untrusted_content]
