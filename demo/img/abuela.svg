<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 26 156 156" role="img" aria-label="Retrato ilustrado de la abuela">
  <!-- Retrato ilustrado y ficticio (no es una persona real ni una foto de stock), respaldo de img/abuela.jpg para la
       llamada del acto 1 de la demo. Para cambiar la foto, deja un abuela.jpg cuadrado en esta carpeta. -->
  <rect x="0" y="0" width="200" height="200" fill="#2E2C33"/>
  <!-- Chaleco -->
  <path d="M28 200c4-38 30-58 72-58s68 20 72 58Z" fill="#7A4E5E"/>
  <path d="M78 146c6 12 14 18 22 18s16-6 22-18c-7-3-14-4-22-4s-15 1-22 4Z" fill="#E9E1D6"/>
  <!-- Cuello -->
  <path d="M87 122h26v22c-4 5-8 8-13 8s-9-3-13-8Z" fill="#C79A7C"/>
  <!-- Pelo gris, recogido -->
  <ellipse cx="100" cy="44" rx="20" ry="14" fill="#C9C6C2"/>
  <path d="M60 92c-4-30 14-50 40-50s44 20 40 50c-6-16-16-24-40-26-24 2-34 10-40 26Z" fill="#D3D0CB"/>
  <!-- Orejas y aros -->
  <ellipse cx="62" cy="98" rx="6" ry="10" fill="#D2A386"/>
  <ellipse cx="138" cy="98" rx="6" ry="10" fill="#D2A386"/>
  <circle cx="62" cy="110" r="2.6" fill="#E8C76A"/>
  <circle cx="138" cy="110" r="2.6" fill="#E8C76A"/>
  <!-- Cara -->
  <path d="M100 56c21 0 37 14 37 38 0 27-16 44-37 44s-37-17-37-44c0-24 16-38 37-38Z" fill="#E0B092"/>
  <path d="M63 90c4-14 15-22 37-24 22 2 33 10 37 24-8-8-18-12-37-13-19 1-29 5-37 13Z" fill="#D3D0CB"/>
  <!-- Lentes -->
  <circle cx="86" cy="98" r="10" fill="none" stroke="#5B5560" stroke-width="2.6"/>
  <circle cx="114" cy="98" r="10" fill="none" stroke="#5B5560" stroke-width="2.6"/>
  <path d="M96 98h8" stroke="#5B5560" stroke-width="2.6"/>
  <!-- Ojos -->
  <path d="M82 99c2.6-2 5.4-2 8 0M110 99c2.6-2 5.4-2 8 0" stroke="#3A2A22" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- Mejillas y arrugas -->
  <ellipse cx="80" cy="114" rx="7" ry="4.5" fill="#E08A6E" opacity=".25"/>
  <ellipse cx="120" cy="114" rx="7" ry="4.5" fill="#E08A6E" opacity=".25"/>
  <path d="M74 106c2 2 4 3 6 3M126 106c-2 2-4 3-6 3" stroke="#C08B6D" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- Nariz y sonrisa -->
  <path d="M100 104c-2 6-3 9-5 11 3 2 7 2 10 0" stroke="#BE8A6A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M89 123c6 5 16 5 22 0" stroke="#9A5546" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
